name: nabu_explain
description: "NabuExplain - Ton professeur IA universel"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Local Storage
  path_provider: ^2.1.5
  
  # HTTP & API
  http: ^1.2.2
  dio: ^5.7.0
  
  # Image
  image_picker: ^1.1.2
  image: ^4.3.0
  
  # UI
  google_fonts: ^6.2.1
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  flutter_markdown: ^0.7.4+3
  flex_color_scheme: ^8.1.0
  glassmorphism: ^3.0.0
  
  # File
  share_plus: ^10.1.4
  path: ^1.9.1
  
  # PDF
  pdf: ^3.11.0
  printing: ^5.13.4
  
  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  flutter_secure_storage: ^9.2.4
  
  # Code highlighting
  highlight: ^0.7.0
  flutter_highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1E3AEF"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 21
